<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Careers Watch | 高质量外企岗位雷达</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Global Careers Watch</p>
        <h1>高质量外企岗位雷达</h1>
        <p class="intro">面向 partnership、donor / institutional relations、stakeholder engagement、public affairs、programme coordination、membership / community 与 social impact 的全球外企机会池。</p>
      </div>
      <div class="hero-meta" id="heroMeta">
        <span>读取中</span>
      </div>
    </section>

    <section class="audit-grid" id="auditGrid" aria-label="岗位统计"></section>

    <section class="toolbar" aria-label="筛选器">
      <label class="toolbar-block search-block">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="公司、岗位、地点、方向">
      </label>
      <label class="toolbar-block">
        <span>状态</span>
        <select id="statusFilter">
          <option value="actionable">可行动</option>
          <option value="all">全部</option>
          <option value="active">有效</option>
          <option value="closing">临近截止</option>
          <option value="expired">已过期</option>
        </select>
      </label>
      <label class="toolbar-block">
        <span>工签风险</span>
        <select id="riskFilter">
          <option value="all">全部</option>
          <option value="low">低风险</option>
          <option value="medium">可验证</option>
          <option value="high">中高风险</option>
        </select>
      </label>
      <label class="toolbar-block">
        <span>匹配度</span>
        <select id="scoreFilter">
          <option value="all">全部</option>
          <option value="4plus">4★ 及以上</option>
          <option value="3">3★</option>
        </select>
      </label>
      <label class="toolbar-block">
        <span>方向</span>
        <select id="categoryFilter">
          <option value="all">全部方向</option>
        </select>
      </label>
      <label class="toolbar-block">
        <span>投递</span>
        <select id="applicationFilter">
          <option value="all">全部</option>
          <option value="not_applied">未标记投递</option>
          <option value="applied">已投递</option>
        </select>
      </label>
      <label class="toolbar-block">
        <span>排序</span>
        <select id="sortFilter">
          <option value="match">匹配度优先</option>
          <option value="date">最新优先</option>
          <option value="company">公司 A-Z</option>
          <option value="risk">工签风险优先</option>
        </select>
      </label>
    </section>

    <section class="summary-bar" id="summaryBar"></section>

    <section class="layout">
      <aside class="rail">
        <section class="rail-card">
          <h2>优先投递</h2>
          <div id="priorityList"></div>
        </section>
        <section class="rail-card">
          <h2>检索原则</h2>
          <div id="watchNotes"></div>
        </section>
      </aside>

      <section class="jobs-panel">
        <div class="section-head">
          <h2>岗位清单</h2>
          <p id="resultCount">读取中</p>
        </div>
        <div class="jobs-list" id="jobsList"></div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
