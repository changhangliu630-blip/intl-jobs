<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Jobs Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <p class="eyebrow">International Jobs Radar</p>
      <div class="hero-headline">
        <div>
          <h1>国际组织岗位雷达</h1>
          <p class="intro">
            把可投岗位、今日截止、历史过期和失效链接放到同一张清单里，不再靠肉眼筛页面。
          </p>
        </div>
        <div class="hero-meta" id="heroMeta">
          <span id="generatedAt">加载中</span>
          <span id="auditDate">加载中</span>
        </div>
      </div>
      <div class="audit-grid" id="auditGrid"></div>
    </header>

    <section class="toolbar">
      <div class="toolbar-block">
        <label for="searchInput">搜索</label>
        <input id="searchInput" type="search" placeholder="岗位名 / 机构 / 地点 / 关键词">
      </div>
      <div class="toolbar-block">
        <label for="statusFilter">状态</label>
        <select id="statusFilter">
          <option value="actionable">可申请中</option>
          <option value="all">全部</option>
          <option value="active">有效</option>
          <option value="closing">今日截止</option>
          <option value="expired">已过期</option>
          <option value="unavailable">链接失效</option>
        </select>
      </div>
      <div class="toolbar-block">
        <label for="categoryFilter">类别</label>
        <select id="categoryFilter">
          <option value="all">全部类别</option>
        </select>
      </div>
      <div class="toolbar-block">
        <label for="sortBy">排序</label>
        <select id="sortBy">
          <option value="match">匹配度优先</option>
          <option value="deadline">截止日期优先</option>
          <option value="organization">机构名称</option>
        </select>
      </div>
      <div class="toolbar-block">
        <label for="applicationFilter">投递状态</label>
        <select id="applicationFilter">
          <option value="all">全部</option>
          <option value="not_applied">未投递</option>
          <option value="applied">已投递</option>
        </select>
      </div>
    </section>

    <section class="summary-bar" id="summaryBar"></section>

    <section class="insight-row">
      <div class="rail-card">
        <h3>优先推进</h3>
        <div id="priorityList"></div>
      </div>
      <div class="rail-card">
        <h3>站点说明</h3>
        <div id="highlights"></div>
      </div>
    </section>

    <section class="jobs-section">
      <div class="section-head">
        <h2>岗位列表</h2>
        <p id="resultCount"></p>
      </div>
      <div class="job-grid" id="jobGrid"></div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
