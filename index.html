<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Jobs Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">International Jobs Radar</p>
        <h1>把“可投”与“已过期”分开，不再靠肉眼筛页面。</h1>
        <p class="intro">
          这是一版重做后的国际组织岗位站点。它把岗位审计结果直接写进数据层，默认只推仍可行动的岗位，同时保留过期与失效链接的完整痕迹。
        </p>
        <div class="hero-meta">
          <span id="generatedAt">加载中</span>
          <span id="auditDate">加载中</span>
        </div>
      </div>
      <aside class="hero-panel">
        <div class="panel-title">本次核查结论</div>
        <div class="audit-grid" id="auditGrid"></div>
      </aside>
    </header>

    <section class="highlights" id="highlights"></section>

    <section class="toolbar">
      <div class="toolbar-block">
        <label for="searchInput">搜索</label>
        <input id="searchInput" type="search" placeholder="岗位名 / 机构 / 地点 / 关键词">
      </div>
      <div class="toolbar-block">
        <label for="statusFilter">状态</label>
        <select id="statusFilter">
          <option value="actionable">可申请中</option>
          <option value="all">全部</option>
          <option value="active">有效</option>
          <option value="closing">今日截止</option>
          <option value="expired">已过期</option>
          <option value="unavailable">链接失效</option>
        </select>
      </div>
      <div class="toolbar-block">
        <label for="categoryFilter">类别</label>
        <select id="categoryFilter">
          <option value="all">全部类别</option>
        </select>
      </div>
      <div class="toolbar-block">
        <label for="sortBy">排序</label>
        <select id="sortBy">
          <option value="match">匹配度优先</option>
          <option value="deadline">截止日期优先</option>
          <option value="organization">机构名称</option>
        </select>
      </div>
    </section>

    <section class="summary-bar" id="summaryBar"></section>

    <main class="jobs-layout">
      <section>
        <div class="section-head">
          <h2>岗位列表</h2>
          <p id="resultCount"></p>
        </div>
        <div class="job-grid" id="jobGrid"></div>
      </section>
      <aside class="side-rail">
        <div class="rail-card">
          <h3>优先推进</h3>
          <div id="priorityList"></div>
        </div>
        <div class="rail-card">
          <h3>已发现的问题</h3>
          <ul class="issue-list">
            <li>旧站只展示一份过时的 jobs.json，缺少 2026-06-07 新增岗位。</li>
            <li>旧站按前端脚本直接隐藏过期岗位，没有审计视图，难以复核历史记录。</li>
            <li>旧站还保留 SKAO 旧筛选，已经不符合当前岗位范围。</li>
          </ul>
        </div>
      </aside>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="./app.js"></script>
</body>
</html>
